# 本 workflow 只负责「main 分支 → GHCR 镜像」这条链路。
# 打 tag 的正式发布仍走 release.yml（goreleaser + GitHub Release + Docker Hub），两者互不干扰：
# 本 workflow 只产出 sha-<commit> 与 main 两个 tag，不碰 :latest（:latest 由 release.yml 拥有）。

name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: '构建后通过 SSH 部署到 VPS（需先配置 VPS_* secrets）'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

concurrency:
  # 同一分支的新 push 取消仍在跑的旧构建，避免排队浪费和镜像 tag 竞态。
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        # metadata-action 会把 owner 中的大写字母转成小写（cnYui → cnyui），
        # GHCR 不接受大写路径，手写镜像名时极易踩这个坑。
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # 显式声明，避免将来在 arm runner 上构建导致服务器 exec format error。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=main-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org

      - name: Summary
        run: |
          {
            echo '### 镜像已推送'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo '服务器拉取：'
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 手动触发且显式勾选 deploy 时才执行；push 到 main 不会自动部署。
  #
  # 需要的 repository secrets（Settings → Secrets and variables → Actions）：
  #   VPS_HOST        生产机地址
  #   VPS_USER        部署账号
  #   VPS_PORT        SSH 端口（与 UFW 放行端口一致）
  #   VPS_SSH_KEY     部署专用私钥
  #   VPS_DEPLOY_DIR  compose 所在目录
  #
  # 安全要求：VPS_SSH_KEY 必须是单独为部署生成的密钥，不要复用管理密钥；
  # 并在服务器 ~/.ssh/authorized_keys 中用 command="<部署脚本>" 限制其只能执行部署，
  # 不开放完整 shell。不接受这个风险就不要用本 job，手动两条命令即可。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_DIR }}"
            docker compose pull
            docker compose up -d
            # 只清理悬空层；带 tag 的历史镜像保留，回滚要用。
            docker image prune -f
            docker compose ps
