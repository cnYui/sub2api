# 本 workflow 只负责「main 分支 → GHCR 镜像」这条链路。
# 打 tag 的正式发布仍走 release.yml（goreleaser + GitHub Release + Docker Hub），两者互不干扰：
# 本 workflow 只产出 sha-<commit> 与 main 两个 tag，不碰 :latest（:latest 由 release.yml 拥有）。

name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: '手动触发时也执行部署（Mac 需 MAC_*+TS_AUTHKEY；VPS 冷备需 VPS_*）'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

concurrency:
  # 同一分支的新 push 取消仍在跑的旧构建，避免排队浪费和镜像 tag 竞态。
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        # metadata-action 会把 owner 中的大写字母转成小写（cnYui → cnyui），
        # GHCR 不接受大写路径，手写镜像名时极易踩这个坑。
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # 显式声明，避免将来在 arm runner 上构建导致服务器 exec format error。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=main-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org

      - name: Summary
        run: |
          {
            echo '### 镜像已推送'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo '服务器拉取：'
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 部署到 VPS —— 2026-09-08 起 VPS 是冷备回滚、不再是生产（生产在 Mac，见下方 deploy-mac）。
  #
  # 触发条件：**仅手动触发并勾选 deploy**。push main 不再自动部署 VPS，
  # 否则每次都会重启冷备 VPS 的应用（其 cloudflared 已 disable、不对外，纯属churn）。
  # 保留此 job 是为了回滚前能把某个镜像先推到 VPS。缺 VPS_* secrets 则优雅跳过。
  #
  # 需要的 repository secrets（Settings → Secrets and variables → Actions）：
  #   VPS_HOST        生产机地址
  #   VPS_USER        部署账号
  #   VPS_PORT        SSH 端口（与 UFW 放行端口一致）
  #   VPS_SSH_KEY     部署专用私钥（OpenSSH 格式，含 BEGIN/END 行）
  #   VPS_DEPLOY_DIR  compose 与 deploy.sh 所在目录
  #
  # 安全要求：VPS_SSH_KEY 必须是单独为部署生成的密钥，不要复用管理密钥；
  # 并在服务器 ~/.ssh/authorized_keys 中用 command="<部署脚本>" 限制其只能执行部署，
  # 不开放完整 shell。VPS 端脚本模板见 deploy/vps-deploy.sh.example。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.deploy
    environment: production
    steps:
      # secrets 不能直接写进 job 级 if，所以先在步骤里判断一次。
      # 缺配置时输出提示并跳过后续步骤，而不是失败——镜像已经推送成功，
      # 部署未配置不应该把整条流水线标红。
      - name: 检查部署配置
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
        run: |
          missing=""
          [ -z "$VPS_HOST" ]       && missing="$missing VPS_HOST"
          [ -z "$VPS_USER" ]       && missing="$missing VPS_USER"
          [ -z "$VPS_SSH_KEY" ]    && missing="$missing VPS_SSH_KEY"
          [ -z "$VPS_DEPLOY_DIR" ] && missing="$missing VPS_DEPLOY_DIR"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo '### 部署已跳过'
              echo
              echo "缺少 secrets：\`${missing# }\`"
              echo
              echo '镜像已推送成功，只是没有自动部署。配置方法见 `deploy/vps-deploy.sh.example`。'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_DIR }}"

            # 绝不执行裸 `docker compose`。生产的 compose 由基础文件 + docker-compose.vps.yml
            # 叠加而成，后者只存在于本机、不在仓库，承载 BILLING_FINAL_MULTIPLIER、
            # 端口绑定到 127.0.0.1 和凭证加密密钥的 secrets 挂载。漏掉它至少会让应用
            # 因缺加密密钥而 log.Fatalf 起不来，是一次无谓的停机。
            #
            # 因此这里要求部署目录自带 deploy.sh（由机器 owner 维护，决定叠加哪些 compose 文件）。
            # 没有就直接失败退出，不做任何猜测性的兜底。
            if [ ! -x ./deploy.sh ]; then
              echo "错误：deploy.sh 不存在或不可执行。" >&2
              echo "模板见仓库 deploy/vps-deploy.sh.example，拷到部署目录并 chmod +x。" >&2
              exit 1
            fi
            # 传具体 sha tag 而非 :main，让这次部署的版本可精确追溯与回滚。
            ./deploy.sh "$IMAGE_TAG"

  # 部署到生产 MacBook（2026-09-08 起生产在 Mac）。
  #
  # Mac 在家用 NAT 后面，云端 runner 没有公网路径直连；因此先用 Tailscale 让 runner
  # 临时加入 tailnet，再 SSH 到 Mac 的 tailscale 内网地址。push main 自动执行，
  # 或手动触发并勾选 deploy。只有配齐 MAC_* + TS_AUTHKEY 才执行，缺则优雅跳过。
  #
  # 需要的 repository secrets：
  #   MAC_HOST     Mac 的 tailscale IP（100.x）
  #   MAC_USER     登录用户
  #   MAC_SSH_KEY  部署专用私钥（已在 Mac authorized_keys 用 command="…/deploy-mac.sh",restrict
  #                锁死：这把钥匙只能跑部署脚本、拿不到自由 shell，tag 经 $SSH_ORIGINAL_COMMAND 传入）
  #   TS_AUTHKEY   Tailscale auth key（建议 reusable + ephemeral），令 runner 临时组网
  #
  # 安全：runner 是 GitHub 托管（非自签），仅 push main / 手动 dispatch 触发，
  # fork PR 碰不到 secrets；即便私钥泄露，command= 也只允许部署合法 sha。
  # Mac 端脚本模板见 deploy/mac-deploy.sh.example（安装为 ~/sub2api/deploy-mac.sh）。
  deploy-mac:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    environment: production
    steps:
      - name: 检查 Mac 部署配置
        id: check
        env:
          MAC_HOST: ${{ secrets.MAC_HOST }}
          MAC_USER: ${{ secrets.MAC_USER }}
          MAC_SSH_KEY: ${{ secrets.MAC_SSH_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          missing=""
          [ -z "$MAC_HOST" ]    && missing="$missing MAC_HOST"
          [ -z "$MAC_USER" ]    && missing="$missing MAC_USER"
          [ -z "$MAC_SSH_KEY" ] && missing="$missing MAC_SSH_KEY"
          [ -z "$TS_AUTHKEY" ]  && missing="$missing TS_AUTHKEY"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo '### Mac 部署已跳过'
              echo
              echo "缺少 secrets：\`${missing# }\`"
              echo
              echo '补齐后（尤其 TS_AUTHKEY）推 main 即自动部署到生产 Mac。'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Connect to Tailscale
        if: steps.check.outputs.ready == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # 临时节点名，便于在 tailscale 后台识别；ephemeral key 跑完自动下线。
          hostname: gha-deploy-${{ github.run_id }}

      - name: Deploy to Mac over Tailscale SSH
        if: steps.check.outputs.ready == 'true'
        env:
          MAC_HOST: ${{ secrets.MAC_HOST }}
          MAC_USER: ${{ secrets.MAC_USER }}
          MAC_SSH_KEY: ${{ secrets.MAC_SSH_KEY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$MAC_SSH_KEY" > ~/.ssh/mac_deploy
          chmod 600 ~/.ssh/mac_deploy
          # Mac 端 authorized_keys 用 command= 强制命令，客户端发什么都只会跑 deploy-mac.sh，
          # 目标版本从 $SSH_ORIGINAL_COMMAND 读取。这里只发这次构建的 sha tag。
          ssh -i ~/.ssh/mac_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=25 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$MAC_USER@$MAC_HOST" "$IMAGE_TAG"
