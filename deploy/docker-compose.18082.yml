services:
  sub2api:
    container_name: sub2api-official-18082
    ports: !override
      - "127.0.0.1:18082:8080"
    volumes:
      - ./data-18082:/app/data:Z
    secrets:
      - source: account_credentials_encryption_key
        target: account_credentials_encryption_key
        mode: 0400
    environment:
      - BILLING_FINAL_MULTIPLIER=16
      - BILLING_MINIMUM_BALANCE_RESERVE=0.01
      - ACCOUNT_CREDENTIALS_ENCRYPTION_KEY_FILE=/run/secrets/account_credentials_encryption_key

  postgres:
    container_name: sub2api-official-18082-postgres
    volumes:
      - ./postgres_data-18082:/var/lib/postgresql/data:Z

  redis:
    container_name: sub2api-official-18082-redis
    volumes:
      - ./redis_data-18082:/data:Z

networks:
  sub2api-network:
    external: true
    name: sub2api-official-18082_sub2api-network

secrets:
  account_credentials_encryption_key:
    file: ${ACCOUNT_CREDENTIALS_ENCRYPTION_KEY_HOST_FILE:?ACCOUNT_CREDENTIALS_ENCRYPTION_KEY_HOST_FILE is required}
